<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Warehouse Inventory System</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow">

<div class="container-fluid">

<h3 class="text-white mb-0">

<i class="bi bi-box-seam"></i>

Warehouse Inventory System

</h3>

</div>

</nav>

<div class="container-fluid mt-4">

<!-- Dashboard -->

<div class="row mb-4">

<div class="col-md-3">

<div class="card shadow card-summary">

<div class="card-body">

<h6>Total Records</h6>

<h2 id="totalRecords">0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card shadow card-summary">

<div class="card-body">

<h6>Total Warehouses</h6>

<h2 id="totalWarehouse">0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card shadow card-summary">

<div class="card-body">

<h6>Total Companies</h6>

<h2 id="totalCompany">0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card shadow card-summary">

<div class="card-body">

<h6>Total Available Qty</h6>

<h2 id="totalAvailableQty">0</h2>

</div>

</div>

</div>

</div>

<!-- Toolbar -->

<div class="card shadow mb-4">

<div class="card-body">

<div class="row g-3">

<div class="col-lg-3">

<label class="btn btn-success w-100">

<i class="bi bi-upload"></i>

Import Excel

<input

type="file"

id="excelFile"

accept=".xlsx,.xls"

hidden>

</label>

</div>

<div class="col-lg-2">

<button

class="btn btn-primary w-100"

id="exportBtn">

<i class="bi bi-download"></i>

Export

</button>

</div>

<div class="col-lg-3">

<input

type="text"

class="form-control"

id="searchInput"

placeholder="Search Warehouse / Company / SKU">

</div>

<div class="col-lg-2">

<select

class="form-select"

id="companyFilter">

<option value="">All Companies</option>

</select>

</div>

<div class="col-lg-2">

<select

class="form-select"

id="statusFilter">

<option value="">Inventory Status</option>

</select>

</div>

</div>

</div>

</div>

<!-- Table -->

<div class="card shadow">

<div class="table-responsive">

<table

class="table table-hover table-bordered align-middle"

id="inventoryTable">

<thead class="table-dark">

<tr>

<th>Warehouse Code</th>

<th>Warehouse Name</th>

<th>Company Code</th>

<th>Company Name</th>

<th>SKU Code</th>

<th>SKU Name</th>

<th>WBS</th>

<th>Unit</th>

<th>Available Qty</th>

<th>Onhand Qty</th>

<th>Intransit Qty</th>

<th>Allocated Qty</th>

<th>Locked Qty</th>

<th>Inventory Status</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
